<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CM97/98 Scout &amp; Assistant</title>
<style>:root{--bg:#f4f7f3;--panel:#fff;--ink:#14201a;--mute:#5b6b60;--line:#dce5de;--acc:#1b6b33;--accbg:#e8f3ea;--good:#0e3b1c;--warn:#4a3b00;--bad:#7a1a12;--hdr:#134b26;--hdrink:#fff;--yel:#f5e22d;--head:#f0f4f1;--hf:"Barlow Condensed","Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Segoe UI Semibold",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101712;--panel:#18211b;--ink:#e6ede8;--mute:#9fb0a4;--line:#2b3a2f;--acc:#5fcf84;--accbg:#1f3526;--good:#8be0a8;--warn:#e8d27a;--bad:#f0968c;--hdr:#0d3a1d;--hdrink:#fff;--head:#1d2a21}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
header{background:var(--hdr);color:var(--hdrink);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
header .status{font-size:12.5px;opacity:.9;flex:1}
header input,header select,header button{font:inherit}
nav{display:flex;gap:2px;padding:8px 16px 0;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:1px solid transparent;background:none;color:var(--mute);padding:8px 14px;cursor:pointer;font:inherit;border-radius:6px 6px 0 0}
nav button.on{background:var(--panel);color:var(--ink);border-color:var(--line);border-bottom-color:var(--panel);font-weight:600;margin-bottom:-1px}
main{padding:14px 16px;max-width:1700px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute);gap:2px}
input[type=text],input[type=number],select{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);min-width:0}
input[type=number]{width:78px}
input[type=text]{width:160px}
button.b{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;cursor:pointer}
button.b:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.mute{color:var(--mute)}.small{font-size:12px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--panel);text-align:left;padding:5px 8px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;font-size:12px}
table.t td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:hover td{background:var(--accbg)}
table.t td.num,table.t th.num{text-align:right}
.scroll{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:6px}
.tag{display:inline-block;padding:1px 6px;border-radius:9px;font-size:11px;background:var(--accbg);color:var(--acc)}
.tag.good{background:#dff3e7;color:var(--good)}.tag.warn{background:#fbf0d2;color:var(--warn)}.tag.bad{background:#f9dcd8;color:var(--bad)}
@media (prefers-color-scheme:dark){.tag.good{background:#1c3a2a}.tag.warn{background:#3f3615}.tag.bad{background:#40211d}}
.star{cursor:pointer;color:var(--mute);font-size:15px}.star.on{color:#e0a800}
.link{color:var(--acc);cursor:pointer;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal .box{background:var(--panel);border-radius:10px;max-width:980px;width:100%;padding:16px 18px;border:1px solid var(--line)}
.modal .x{float:right;cursor:pointer;font-size:20px;color:var(--mute)}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:4px 18px}
.attr{display:flex;align-items:center;gap:6px;font-size:12.5px}
.attr span.n{width:105px;color:var(--mute)}.attr b{width:20px;text-align:right}
.bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(5,92px);gap:4px}
.sq{height:56px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;cursor:pointer;background:var(--panel);color:var(--mute);padding:2px;line-height:1.15}
.sq.on{background:var(--accbg);border-color:var(--acc);color:var(--ink);font-weight:600}
.sq.pen{border-color:var(--warn)}
.cols{columns:3 220px;column-gap:20px}
.cols label{display:block;font-size:13px;padding:1px 0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:34px;text-align:center}
.drop.hot{border-color:var(--acc);background:var(--accbg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv div:nth-child(odd){color:var(--mute)}
.warnbox{background:#fbf0d2;color:#5a4400;border-radius:6px;padding:8px 10px;font-size:12.5px;margin:8px 0}
@media (prefers-color-scheme:dark){.warnbox{background:#3f3615;color:#f1d98a}}

.pos{display:inline-flex;gap:2px;align-items:center;white-space:nowrap}
.pc{font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;border:1px solid var(--accent,#2a62c9)}
.pc.nat{background:var(--accent,#2a62c9);color:#fff}
.pc.cov{background:transparent;color:inherit;opacity:.65;border-style:dashed}
.pc.side{border-radius:10px}
.psep{opacity:.4;margin:0 2px}
.fg{background:rgba(46,160,67,.30)}.fo{background:rgba(240,160,30,.32)}.fr{background:rgba(220,60,60,.26)}
.badin{outline:2px solid #d33}
.pp{display:grid;grid-template-columns:34px repeat(5,52px);gap:3px;width:max-content}
.pp .pl{font-size:11px;align-self:center;opacity:.7}
.pp .pq{height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;font-weight:600}
.pgk{margin-top:4px;width:max-content;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:600}
.sq{position:relative}.arr{position:absolute;top:1px;right:3px;font-size:14px;line-height:1;color:var(--mute);padding:0 3px;border-radius:4px}.arr:hover{background:var(--line)}.arr.on{color:var(--acc);font-weight:700}.fchips button{margin:0 4px 4px 0}
table.t td.c,table.t th.c{text-align:center}
table.pk th.c,table.pk td.c{min-width:92px}
table.pk td:first-child,table.pk th:first-child{min-width:64px}
table.pk td{vertical-align:middle}
.sbar{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:visible;min-width:200px}
.sbar .sg{position:absolute;top:3px;height:8px}
.sbar .s0{background:hsla(0,60%,55%,.35);border-radius:4px 0 0 4px}.sbar .s1{background:hsla(40,20%,60%,.30)}.sbar .s2{background:hsla(110,45%,50%,.35)}.sbar .s3{background:hsla(125,55%,42%,.55);border-radius:0 4px 4px 0}
.sbar .mk{position:absolute;top:0;width:2px;height:14px;margin-left:-1px;background:var(--mute)}
.sbar .mk.top6{background:#2f6fdc}.sbar .mk.you{top:-2px;height:18px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}

/* ===== v2 restyle ===== */
#top{background:repeating-linear-gradient(90deg,#134b26 0 64px,#16542b 64px 128px)}
#top header{background:none;padding:16px 28px 6px;gap:14px}
#top header h1{font-family:var(--hf);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;color:var(--yel);line-height:1}
#top header h1 span{color:var(--yel)}
header .status{color:#cfe3d4;opacity:1}
header input[type=text]{height:30px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:6px}
header button.b{height:40px;padding:0 18px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;font-weight:600}
header button.b:hover{background:rgba(255,255,255,.12);border-color:#fff}
#top nav{background:none;border:none;padding:6px 28px 0;gap:4px}
#top nav button{padding:12px 22px;color:#dcebdf;font-size:15px;border:none;border-radius:10px 10px 0 0}
#top nav button.on{background:var(--bg);color:var(--hdr);font-weight:600;margin-bottom:0}
@media (prefers-color-scheme:dark){#top nav button.on{color:var(--acc)}}
main{padding:24px 28px 40px;max-width:1800px}
.panel{border-radius:16px;padding:20px 24px;margin-bottom:20px;border-color:var(--line)}
.panel h3,.sec h4,.rc h3{font-family:var(--hf);font-size:24px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--hdr);margin:0 0 10px;line-height:1.1}
@media (prefers-color-scheme:dark){.panel h3,.sec h4,.rc h3{color:var(--acc)}}
label.f{font-size:13px;font-weight:500;color:var(--mute);gap:6px}
input[type=text],input[type=number],select{height:40px;padding:0 12px;border:1px solid #c9d5cc;border-radius:8px;font-size:14px}
@media (prefers-color-scheme:dark){input[type=text],input[type=number],select{border-color:var(--line)}}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
button.b{height:40px;padding:0 16px;border-radius:8px;border:1px solid #c9d5cc;font-weight:500}
button.b:hover{border-color:var(--acc);color:var(--acc)}
button.b.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.b.p:hover{color:#fff;filter:brightness(1.1)}
button.b.sm{height:32px;padding:0 12px;font-size:13px}
.fchips button.b{height:34px;border-radius:99px;padding:0 14px}
table.t th{background:var(--head);color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:12px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px}
table.t tr:hover td{background:var(--accbg)}
.scroll{border-radius:12px}
.tag{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accbg);color:var(--hdr)}
.tag.good{background:#cdebd5;color:#0e3b1c}.tag.warn{background:#fbf0c0;color:#4a3b00}.tag.bad{background:#f6d6d3;color:#7a1a12}
.tag.cap{background:#f5e22d;color:#14201a}.tag.set{background:#fbf6c4;color:#14201a}
@media (prefers-color-scheme:dark){.tag{color:var(--ink)}.tag.good{background:#1c3a2a;color:#8be0a8}.tag.warn{background:#3f3615;color:#e8d27a}.tag.bad{background:#40211d;color:#f0968c}}
.fg{background:#cdebd5}.fo{background:#fbf0c0}.fr{background:#f6d6d3}
@media (prefers-color-scheme:dark){.fg{background:rgba(46,160,67,.30)}.fo{background:rgba(240,160,30,.32)}.fr{background:rgba(220,60,60,.26)}}
/* scout layout */
.sw{display:flex;gap:24px;align-items:flex-start}
.rail{flex:0 0 290px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:2px 16px 18px}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none;padding-bottom:0}
.sec h4{margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sec h4 i{font-style:normal;background:var(--acc);color:#fff;border-radius:99px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.sec .fl{display:flex;flex-direction:column;gap:12px}
.sec .fl input[type=text],.sec .fl select{width:100%}
.sec .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec .two input{width:100%}
.sec .two + .two{margin-top:0}
.sec .chk{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.sec .chk label{display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid #c9d5cc;border-radius:99px;font-size:13px;cursor:pointer;background:var(--panel)}
.sec.role{background:#fffbd5;border:2px solid var(--yel);border-radius:14px;padding:16px;margin:16px 0 0}
@media (prefers-color-scheme:dark){.sec.role{background:#2b2a12}}
.rc{flex:1 1 0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rc .rh{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.rc .rh h3{margin:0;font-size:26px;flex:1 1 auto}
.rc .rb{padding:0 22px 16px}
.rc .scroll{border:none;border-radius:0;margin:0 -22px;max-height:70vh}
.addrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.addrow select{flex:1;min-width:0;width:auto}
.addrow input{width:72px}
.sub{font-size:13px;font-weight:600;margin:10px 0 6px;display:flex;align-items:center;justify-content:space-between}
/* assistant */
.ctl{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.ctl select,.ctl input[type=text]{width:260px}
.am{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.amf{flex:0 0 430px;max-width:100%;margin-bottom:0}
.amr{flex:1 1 420px;min-width:0}.amr .panel{margin-bottom:0}.am{margin-bottom:20px}
.fm{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.tp{position:relative;width:260px;aspect-ratio:310/440;background:#0f4a1a;border:3px solid #3a3a3a;border-radius:4px;overflow:hidden;font-family:Arial,sans-serif;flex:0 0 auto}
.tp i{position:absolute;border:1px solid rgba(255,255,255,.25);display:block}
.tp b{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:400;line-height:1.2;white-space:nowrap}
.tp b span{display:block;font-size:12px;color:#fff}.tp b em{display:block;font-style:normal;font-size:10px;color:var(--yel)}
.grid{grid-template-columns:repeat(5,66px);gap:4px}
.sq{height:46px;font-size:11px;border-radius:8px;overflow:hidden}
.sq.on{background:var(--yel);border-color:#d9c700;color:#14201a}
.sq.pen{border-color:#c09000}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:20px;font-size:14px}
.caps .cc{display:flex;flex-direction:column;gap:8px}
.caps .cc b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.caps .cl{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;border-top:1px solid var(--line);padding-top:8px}
.caps .cl.f1{font-weight:600;color:var(--acc)}.caps .cl span+span{color:var(--mute);font-weight:400}
@media (max-width:900px){.sw{flex-direction:column}.rail{flex-basis:auto;width:100%}.caps{grid-template-columns:1fr 1fr}}

/* compact scout table + frozen name */
.rc table.t,table.t.fz2{font-size:12px}
.rc table.t td{padding:5px 7px}.rc table.t th{padding:9px 7px;font-size:11px}
.rc .rh{padding:12px 18px}.rc .rh h3{font-size:24px}
.rc .rh button.b,.rc .rh select{height:34px;font-size:13px;padding:0 12px}
.rc .rb{padding:0 0 12px}.rc .rb>.row,.rc .rb>.small{margin-left:18px;margin-right:18px}
.rc .scroll{margin:0;max-height:calc(100vh - 240px);min-height:380px}
table.fz3 th:nth-child(-n+3),table.fz3 td:nth-child(-n+3),table.fz2 th:nth-child(-n+2),table.fz2 td:nth-child(-n+2){position:sticky;background:var(--panel);z-index:2}
table.fz3 th:nth-child(-n+3),table.fz2 th:nth-child(-n+2){background:var(--head);z-index:4}
table.fz3 th:nth-child(1),table.fz3 td:nth-child(1){left:0;min-width:34px;width:34px;text-align:center}
table.fz3 th:nth-child(2),table.fz3 td:nth-child(2){left:34px;min-width:30px;width:30px;text-align:center}
table.fz3 th:nth-child(3),table.fz3 td:nth-child(3){left:64px;min-width:150px;box-shadow:2px 0 0 var(--line)}
table.fz2 th:nth-child(1),table.fz2 td:nth-child(1){left:0;min-width:40px;width:40px}
table.fz2 th:nth-child(2),table.fz2 td:nth-child(2){left:40px;min-width:170px;box-shadow:2px 0 0 var(--line)}
table.fz3 tr:hover td:nth-child(-n+3),table.fz2 tr:hover td:nth-child(-n+2){background:var(--accbg)}
/* tactics pitch picker */
.tp.big{width:380px;max-width:100%;margin:0 auto 4px;aspect-ratio:310/470}
.sp{position:absolute;transform:translate(-50%,-50%);width:19%;height:11%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;border-radius:10px;cursor:pointer;color:rgba(255,255,255,.42);font-size:11px;border:1px dashed transparent;z-index:1}
.sp:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff}
.sp .nm{font-size:13px;color:#fff;white-space:nowrap}
.sp.on{background:rgba(245,226,45,.16);border:1px solid rgba(245,226,45,.65);color:var(--yel);font-weight:600}
.sp.on .sl{font-size:10px}
.sp .pn{font-size:10px;color:#ffb347}
.sp.gk{cursor:default;color:var(--yel);background:none;border:none;pointer-events:none}
.sp.gk .sl{font-size:10px}
.ctl .fchips{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-end;align-items:center}
.ctl .fchips button.b{margin:0;height:34px}
/* round 3 */
.sp{width:20%;border:1px dashed rgba(255,255,255,.4);padding:0}
.sp .nm{font-size:13px;font-weight:600;letter-spacing:-.01em}
.sp .nm.lg{font-size:12px;letter-spacing:-.02em}
.sp .sl{font-size:10px}
.sp:hover{border-style:solid}
.sp.on{border:1px solid rgba(245,226,45,.75)}
.sp.gk{width:20%;cursor:default;pointer-events:none;color:#fff;background:#2d3a8c;border:1px solid #8c9be8;font-weight:600}
.sp.gk .sl{color:#cfd6ff}
.sp.gk .nm{font-size:13px;font-weight:600}
.sec h4 i{font-family:"Segoe UI",Arial,sans-serif;font-weight:700;font-size:14px;line-height:1;display:inline-grid;place-items:center;padding:0;flex:0 0 auto}
.amf{flex:0 0 420px}
.amr{flex:1 1 0;min-width:0}
.amr .panel{padding:16px 16px}
.amr table.t{font-size:12px}.amr table.t th{padding:9px 7px;font-size:11px}.amr table.t td{padding:5px 7px}
.amr .small.mute{margin-bottom:6px}
.amr table.pk td:last-child{white-space:normal;min-width:190px;max-width:260px;font-size:11px}
.amr table.pk th:first-child,.amr table.pk td:first-child{min-width:0}
.am{align-items:stretch}
.amr .tag{padding:2px 8px;font-size:11px;white-space:nowrap}
.amr table.pk th.c,.amr table.pk td.c{min-width:0;padding-left:5px;padding-right:5px}
.amr table.pk td:last-child{min-width:150px;max-width:210px}
/* round 4: horizontal filters, full-width table */
.sw{flex-direction:column;align-items:stretch;gap:16px}
.rail{flex:none;width:100%;display:grid;grid-template-columns:1.15fr 1.15fr 1.3fr 1fr;gap:0 22px;padding:4px 22px 14px}
.rail.hid{display:none}
.rail .sec{border-bottom:none;padding:12px 0 0;border-right:1px solid var(--line);padding-right:22px}
.rail .sec:nth-child(4){border-right:none;padding-right:0}
.rail .sec.role{border-right:2px solid var(--yel);margin:12px 0 0;padding:14px}
.rail .sec h4{font-size:20px;margin-bottom:8px}.rail .sec h4 i{width:24px;height:24px;font-size:13px}
.rail .sec:nth-child(1) .fl,.rail .sec:nth-child(2) .fl{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.rail .sec:nth-child(1) .fl .chk{grid-column:1/-1}
.rail input[type=text],.rail input[type=number],.rail select{height:34px;font-size:13px}
.rail label.f{gap:3px;font-size:12px}
.rail .sec .two{gap:6px}
.rail .sub{margin:6px 0 4px}
.rail .sec .chk{font-size:13px;gap:4px 12px}
.rc .scroll{max-height:calc(100vh - 170px)}
@media (max-width:1200px){.rail{grid-template-columns:1fr 1fr}.rail .sec{border-right:none}}
@media (max-width:700px){.rail{grid-template-columns:1fr}}
.sw .rc{flex:none;width:100%}

/* round 5 */
.rail .sec.role{background:none;border:none;border-right:none;padding:12px 0 0;margin:0}
.rail .sec:nth-child(3){padding-right:22px}
.chk.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
.chk.pg label{margin:0!important;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}

<body><div id="top"><header id="hdr"></header><nav id="tabs"></nav></div><main id="view"></main>
<script>
'use strict';
/* CM97/98 Scout & Squad Picker - core readers and scoring. Read-only. */

const ATTRS=['Adaptability','Aggression','Big-Occasion','Character','Consistency','Creativity','Determination','Dirtyness','Dribbling','Flair','Heading','Influence','Inj Prone','Marking','Off the ball','Pace','Passing','Positioning','Set Pieces','Shooting','Stamina','Strength','Tackling','Technique'];
const POS=['GK','Sweeper','Defence','Anchor','Midfield','Support','Attack','Right','Left','Central'];
const POS_SHORT=['GK','Sw','Def','Anc','Mid','Sup','Att','R','L','C'];
const BANDS=['Sweeper','Defence','Anchor','Midfield','Support','Attack']; // pitch rows 1..6
const AVAIL={0:'Available',1:'Transfer listed',2:'Requested transfer',3:'Loan listed',4:'Free agent (no club)',5:'Unavailable',6:'Likely unavailable',10:'Recently signed',11:"Club won't sell (can afford to keep him)",12:'Recently signed',13:'Club has too few goalkeepers to sell',14:'Club squad too small to sell',15:'Loan deal in place',16:'Rival club (will not deal)'};
const LEAGUE_NAMES={EPR:'England: Premier League',ED1:'England: Division 1',ED2:'England: Division 2',ED3:'England: Division 3',ENL:'England: Non-league'};

function u16(d,o){return d[o]|(d[o+1]<<8);}
function latin(d,s,e){let r='';for(let i=s;i<e;i++)r+=String.fromCharCode(d[i]);return r;}

/* ---- GAMESS16.IDX: 7 slots of 0x50 bytes, name = first NUL-terminated string ---- */
function parseIdx(d){
  const out=[];
  for(let s=0;s<7;s++){
    const base=s*0x50;if(base+0x50>d.length)break;
    let e=base;while(e<base+0x50&&d[e]!==0)e++;
    out.push({slot:s+1,name:latin(d,base,e)});
  }
  return out;
}

/* ---- generic PLAYERS.DB1 / TMDATA.DB1 reader (self-describing header, big-endian numbers) ---- */
function parseDB1(d){
  const n=u16(d,0);let p=2;const fields=[];
  for(let i=0;i<n;i++){
    const L=d[p];const name=latin(d,p+1,p+1+L);p+=1+L;
    fields.push({name,t:d[p],s:d[p+1]});p+=4;
  }
  let rec=0;for(const f of fields)rec+=f.s;
  const body=p+6;const count=Math.floor((d.length-body)/rec);
  const recs=new Array(count);
  for(let k=0;k<count;k++){
    let q=body+k*rec;const r={};
    for(const f of fields){
      if(f.t===1){let e=q;const lim=q+f.s;while(e<lim&&d[e]!==0)e++;r[f.name]=latin(d,q,e);}
      else{let v=0;for(let i=0;i<f.s;i++)v=v*256+d[q+i];r[f.name]=v;}
      q+=f.s;
    }
    recs[k]=r;
  }
  return {fields,recs};
}

/* ---- TMDATA{n}.S16: u16 count, then per team 7 strings (u16 length + text) + 1466 byte block ---- */
function parseTeamsSave(d){
  const cnt=u16(d,0);let p=2;const teams=[];
  for(let i=0;i<cnt;i++){
    const ss=[];
    for(let k=0;k<7;k++){const L=u16(d,p);ss.push(latin(d,p+2,p+2+L));p+=2+L;}
    const nat=u16(d,p+28);
    teams.push({id:i,off:p,name:ss[0],short:ss[1],stadium:ss[6],natId:nat,div:d[p+103],rep:d[p+60],capacity:u16(d,p+69),nflag:d[p+0x24],x4f:u16(d,p+0x4f)});
    p+=1466;
  }
  return teams;
}

/* ---- PLDATA{n}.S16 ---- */
function parsePlayersSave(d){
  const cnt=u16(d,0);let p=2;const out=[];
  const dv=new DataView(d.buffer,d.byteOffset,d.byteLength);
  for(let i=0;i<cnt;i++){
    let L=u16(d,p);const first=latin(d,p+2,p+2+L);p+=2+L;
    L=u16(d,p);const last=latin(d,p+2,p+2+L);p+=2+L;
    const b=p;  // 360 byte block starts here
    const pl={idx:i,first,last,name:(first?first+' ':'')+last};
    pl.off=b;pl.natId=u16(d,b+8);pl.clubId=u16(d,b+15);
    pl.dobD=d[b+20];pl.dobM=d[b+21];pl.dobY=1900+d[b+22];
    const b0=d[b+23],b1=d[b+24],b2=d[b+25];
    pl.pos=[b0&3,(b0>>2)&3,(b0>>4)&3,(b0>>6)&3,b1&3,(b1>>2)&3,(b1>>4)&3,(b1>>6)&3,b2&3,(b2>>2)&3];
    pl.ca=u16(d,b+26);pl.pa=u16(d,b+28);pl.rep30=u16(d,b+30);pl.rep=u16(d,b+32);pl.talent=d[b+34];
    pl.wage=Math.round(dv.getFloat64(b+68,true)*2);
    pl.value=Math.round(dv.getFloat64(b+122,true)*2);
    pl.joinD=d[b+76];pl.joinM=d[b+77];pl.joinY=1900+d[b+78];
    pl.endD=d[b+79];pl.endM=d[b+80];pl.endY=1900+d[b+81];
    pl.inj=d[b+203];pl.banN=d[b+210];pl.banD=d[b+211];pl.banM=d[b+212];pl.banY=1900+d[b+213];pl.cb=d.slice(b+141,b+141+32);pl.cond=Math.floor(d[b+197]*u16(d,b+198)/10000);pl.banEN=d[b+219];pl.banED=d[b+220];pl.banEM=d[b+221];pl.banEY=1900+d[b+222];pl.sus=false;pl.susE=false;pl.intl=0;pl.avail=d[b+138];pl.availRaw=pl.avail;if(pl.avail===0&&d[b+143]&&d[b+146]&&d[b+148])pl.avail=6;pl.wanted=d[b+139];
    pl.attr={};for(let a=0;a<24;a++)pl.attr[ATTRS[a]]=d[b+234+a];
    out.push(pl);
    p=b+360;
  }
  return out;
}

/* ---- competitions (CPDATA): squad size and the foreign-player limit.
   Record byte 0x40 = named subs, 0x42 = most foreign ("non-assimilated") players allowed in the match-day squad (16 = no limit). ---- */
function parseComps(cpf){
  const out=[];if(!cpf)return out;let q=2;const u=(d,p)=>d[p]|(d[p+1]<<8);
  while(cpf.length-q>0x20670+10){const ss=[];for(let k=0;k<5;k++){const L=u(cpf,q);ss.push(latin(cpf,q+2,q+2+L));q+=2+L;}
    const rec=cpf.subarray(q,q+0x7d4);out.push({code:ss[1],name:ss[0],type:rec[0x1c],subs:rec[0x40],fmax:rec[0x42]});q+=0x7d4;}
  return out;
}
/* The game's own "foreign" test. A player is foreign for a club when the club's country is on the game's exempt list
   and the player's country is not. Read from the game code; English and Scottish clubs also treat Jamaica as exempt,
   Portuguese clubs treat Brazil, Angola and Mozambique as exempt. National teams and special teams never have foreigners. */
function makeForeign(world){

// position penalty for player in square (row 1..6, col 1..5)
function penalty(pl,row,col){

/* ---- Hungarian (rows <= cols), minimise cost ---- */
function hungarian(cost){
  const n=cost.length,m=cost[0].length;
  const INF=1e18,u=new Array(n+1).fill(0),v=new Array(m+1).fill(0),p=new Array(m+1).fill(0),way=new Array(m+1).fill(0);
  for(let i=1;i<=n;i++){
    p[0]=i;let j0=0;const minv=new Array(m+1).fill(INF),used=new Array(m+1).fill(false);
    do{
      used[j0]=true;const i0=p[j0];let delta=INF,j1=0;
      for(let j=1;j<=m;j++)if(!used[j]){
        const cur=cost[i0-1][j-1]-u[i0]-v[j];
        if(cur<minv[j]){minv[j]=cur;way[j]=j0;}
        if(minv[j]<delta){delta=minv[j];j1=j;}
      }
      for(let j=0;j<=m;j++){if(used[j]){u[p[j]]+=delta;v[j]-=delta;}else minv[j]-=delta;}
      j0=j1;
    }while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1;}while(j0);
  }
  const ans=new Array(n).fill(-1);
  for(let j=1;j<=m;j++)if(p[j])ans[p[j]-1]=j-1;
  return ans;
}

/* ---- bench: one spare keeper (at most one) + outfield players picked so that every square has cover ---- */
function makeBench(slots,rest,spareGk,cfg,fr,allow){
  const bench=[];
  const lim=fr&&fr.limit!=null;let left=lim?Math.max(0,allow):1e9;
  if(spareGk&&lim&&fr.isF(spareGk)){if(left>0)left--;else spareGk=(fr.gkAlt||[]).find(g=>!fr.isF(g))||null;}
  const outfield=rest.filter(p=>p.pos[0]<2);
  const want=spareGk?4:5;
  const pen=(p,s)=>penalty(p,s.row,s.col);
  const cov=slots.map(()=>-1e9);          // best covering rating so far per square (cover = position penalty 30 or less)
  const chosen=[];
  while(chosen.length<want&&chosen.length<outfield.length){
    let bp=null,bv=-1e18;
    for(const p of outfield){if(chosen.includes(p))continue;
      if(lim&&left<=0&&fr.isF(p))continue;
      let v=0;
      slots.forEach((s,i)=>{if(pen(p,s)>30)return;const a=adjusted(p,cfg,s.row,s.col);
        if(cov[i]<-1e8)v+=100+a;                 // a square nobody on the bench covers yet: big bonus
        else if(a>cov[i])v+=(a-cov[i]);});        // otherwise only the improvement counts
      v+=0.01*p.ca;                               // tie-break on quality
      if(v>bv){bv=v;bp=p;}}
    if(!bp)break;
    if(lim&&fr.isF(bp))left--;
    chosen.push(bp);slots.forEach((s,i)=>{if(pen(bp,s)<=30)cov[i]=Math.max(cov[i],adjusted(bp,cfg,s.row,s.col));});
  }
  if(spareGk)bench.push({player:spareGk,covers:'Goalkeeper'});
  for(const p of chosen)bench.push({player:p,covers:slots.filter(s=>pen(p,s)<=30)});
  return bench;
}

/* ---- best 11 for a formation ---- */
function solveSquad(squad,squares,cfg,excluded,fr){

      for(let it=0;it<30&&cnt(best)>cap;it++){hi*=2;best=run(hi);} 
      for(let it=0;it<28;it++){const mid=(lo+hi)/2,a=run(mid);if(cnt(a)<=cap){hi=mid;best=a;}else lo=mid;}

  const key=mode+'|'+t.league+'|'+sq.club+'|'+shape.map(s=>s.join('')).join(',')+'|'+W.players.length;

      h('p',null,'As I learned what data the game holds, it grew into more than a scout. It now includes some of the quality-of-life features I like in the newer FM games, such as your squad depth and how your team compares with the rest of the league, so you can see where to strengthen.'),
      h('p',null,'You might use all of it or just a part. Either way, I am sharing it in case it helps your 97/98 save. I plan to keep adding features, and I would welcome feedback and suggestions. You can reach me on X at ',X('RobertoLarcos_6','@RobertoLarcos_6'),'.'),
      h('p',null,'A real-time scout and squad tool for Championship Manager 97/98 v2. It reads your saved game and lets you search, sort and filter players, applying the match engine\'s own scoring rules to give each player a rating. As well as the Scout, the Assistant Manager gives you detailed insights into your squad and your best 11, based on your tactics.'),
      h('p',null,B('It only reads your files. It never writes to your game folder and nothing is uploaded.')),
      h('p',{class:'small'},'Jump to: ',...jump.flatMap(([t,k],n)=>[n?' · ':'',h('span',{class:'link',onclick:()=>{const e=document.getElementById('doc-'+k);e&&e.scrollIntoView({behavior:'smooth',block:'start'});}},t)]))),
    sec('Quick start',
      h('ol',null,
        li('Click ',B('Choose game folder…'),' and select the ',B('Data'),' folder that holds your saves. For example:',h('pre',{class:'dirlist'},'C:\\Users\\<your name>\\Documents\\Games\\CM9798\\cm9798_fan_mode\\cm9798\\Data\\cm9798'),'If the save does not load, see Troubleshooting.'),
        li('Choose the save slot from the drop-down and click ',B('Load this save'),'. The most recently saved slot is listed first.'),
        li('Go to ',B('Assistant Manager'),', search for your club and select it. The tool remembers your club and shows recently used clubs as buttons.'),
        li('If you advance time in the game, save it, then click ',B('Reload'),' in the header (Chrome and Edge) to read the same save again without choosing the folder. In other browsers, or to switch saves, use ',B('Load another save'),'. Your shortlist and settings are kept.'),
        li('On the front screen, ',B('Load last save'),' opens the folder you used last time in one click (Chrome and Edge). Your browser may ask you to allow access again each time you open the tool.'))),
    sec('The numbers: what they mean',
      h('p',null,B('Rating'),' is the tool\'s main score, and it comes straight from the match engine. The game has its own table for each square on the pitch saying how much every attribute counts there, and the tool applies those game values as they are. It then includes the player\'s CA and the position penalty for playing him on that square. The result is shown as a % of a perfect player on that square: 20 in every attribute the engine reads and the maximum CA of 200, scored by the same formula. So 80% means he has 80% of that maximum. The scale does not depend on who is in your save, so a rating means the same in every save. In the Scout, the Rating column shows each player\'s best score across the pitch, and the Best column shows the square. The Assistant Manager builds your best 11 on this number. The engine\'s attribute weightings are the game\'s own and are not editable here (the only adjustable part is the goalkeeper blend, which is an estimate). It is the engine\'s view of how a player performs, not a tactics opinion.'),
      h('p',null,B('Role fit'),' is a different measure, and it is the tool\'s own rather than the engine\'s. For each role (DC, WB, AM and so on) there is a profile saying which attributes matter and by how much (blank or 0 means ignored). A player\'s role fit is how well his attributes match that profile, from 0 to 100%, where 100% means 20 in every attribute the role uses. It does not include CA or position penalty. The default profiles are my estimates, built from tested position guidance, not values from the game, and you can change any of them in Settings under Position role profiles. Changing a profile changes Role fit, the best role, the role fit filters and the colours, but it does not change the Rating or the best 11, which use the engine. Each player has a fit for every role, shown in the Scout columns and in the player window. Use Rating to ask who plays best on a square, and Role fit to compare how well suited players are to a role.'),
      h('p',null,B('Position penalty'),' is the penalty on a player\'s Rating for playing in a non-natural or unsuitable position. You can see his full positional grid by clicking his name.'),
      h('p',null,B('Upgrade'),' (Scout, role finder) is how much better a player would be than your best current option for that slot, in rating points. It needs your club and formation to be set.'),
      h('p',null,B('Arrow suitability.'),' Shown for every outfield player as Yes, Maybe or No plus a %. In the game, an arrow does not move a player. It gives him two squares: his own and the one the arrow points to. Each time the match engine decides who is involved in a move, it scores him on one of those two squares: either the one that suits that part of the pitch better, or the one that suits it worse. The % is the chance he is scored on the better one. That chance comes from his Off the ball and Positioning added together (out of 40): the higher the total, the more often he gets the better square, up to about 40% at 20 and 20. Yes, Maybe and No are the tool\'s own cut-offs on that total, which you can change in Settings. The % assumes he is at full match fitness: a tired player gets the better square less often, and an arrow always costs some extra fatigue.'),
      h('p',null,B('Arrow length.'),' The % is based on a one-square arrow. The game also allows longer arrows, and we do not yet know how arrow length changes the chance, so treat the figure as a guide for one-square arrows only.'),
      h('p',null,B('Goalkeepers.'),' The engine has no keeper-only attributes. Keepers are rated by the same engine profiles as everyone else: shot stopping, rushing out and aerial contests, blended. The blend is an estimate you can change in Settings. A keeper\'s Rating is a % of a perfect keeper, so compare keepers with keepers, not with outfield players. Outfield position ratings show N/A for keepers.')),
    sec('Scout tab',
      h('ol',null,
        li(B('Find players.'),' Name, club, nation, league and transfer status. ',B('Hide unavailable'),' removes everyone the game would refuse to sell to you. ',B('Shortlist only'),' limits the list to your shortlisted players (in the tool).'),
        li(B('Player profile.'),' Age, CA (Current Ability), PA (Potential Ability), value, wage and contract end date. Value is a full figure: type 500000 for £500k, 1000000 for £1m.'),
        li(B('Positions and skills.'),' Tick positions a player must be able to play (ticking several requires all). ',B('Position fit filters'),' ask for a minimum role fit. ',B('Position rating filters'),' ask for a minimum Rating if he plays that position (for example a DC with at least 60). ',B('Attribute filters'),' set min and max on any attribute.'),
        li(B('Role finder.'),' Lets you search for players for specific positions in your tactic. To use it, first load your team in the Assistant Manager and select your formation. Then, in the Scout tab, pick your position slot (GK first, then SW, D, DM, M, AM, ST, and the side) to rank the results by Rating for that position. Set how much position penalty you will accept. ',B('Clear role finder'),' removes this filter but keeps your other filters. The ',B('Upgrade @ slot'),' column shows how much better a player is than your best player in that slot, using the tool\'s engine-based Rating.')),
      h('p',null,'Click a column heading to sort. Click a name for the full player window with coloured attributes, role fit, Rating by position and position ratings by square. Use ',B('★'),' to shortlist, the ',B('⇄'),' boxes to compare up to three players, ',B('Columns…'),' to choose what is shown and ',B('Export CSV'),' to take the list into a spreadsheet.'),
      h('p',null,B('Build your own view.'),' Drag a column heading left or right to move it (the star and name stay in front); your order is remembered in this browser, and ',B('Columns…'),' keeps it when you add or remove columns. ',B('Reset to default'),' in that window puts everything back. ',B('Views'),' saves the columns you show and their order under a name, so you can load a layout (say, one for midfielders) in one click. The ',B('rating columns'),' (DL/DR, DC, DMC, MC, AM, SC, and GK for keepers) are off by default: they give each player\'s Rating if he plays that position, position penalty included, so you can sort or read across and spot players at the rating you want in a given role. Outfield players show N/A in the GK column and keepers only have the GK one.')),
    sec('Regens tab',
      h('p',null,B('What a regen is.'),' At the end of each season the game removes a number of players (retirements, but also some younger players) and replaces each one with a brand new player, called a ',B('regen'),'. The regen is given a new name and date of birth but takes over the old player\'s nationality, positions and most of his attributes and ability, so a great player who leaves is often replaced by a similar one, usually younger and cheaper. Regens can be any age, and the game does not tell you who replaced whom.'),
      h('p',null,B('What the tool does.'),' It finds every regen in your save and shows the player he replaced, with their starting CA and PA, so you can hunt for the young, cheap regens of top players. It needs PLAYERS.DB1 from the same game, in your Data folder. Nothing is stored and it works from a single save.'),
      h('p',null,B('How it finds them.'),' The game saves each regen in the same place in its player list as the player he replaced, and that list follows the order of PLAYERS.DB1. The tool lines your save up with PLAYERS.DB1 using the players who are still in both. Anyone in the save who is not in PLAYERS.DB1 is a regen. The players missing from the save sit in the gaps, so within each gap the regens and the retired players are paired in order, keeping only pairs with the same nationality and compatible positions. Attributes are never used to decide who is a regen. They are only used to rank the few cases where two players fit equally.'),
      h('ul',null,
        li(B('Retired Player / Regen Player.'),' The amber block is the retired player as he was at the start of the game (name, club, CA and PA then). The green block is the regen as he is now. Click the retired player to compare their attributes side by side.'),
        li(B('Uncertain and Not found.'),' Almost every regen is matched to one retired player, so nothing is shown for those. ',B('Uncertain'),' means two or more players in the same gap fit equally well, usually two players of the same nation and position side by side in the database with no attributes recorded, so the file cannot tell them apart. The best guess is shown and you can switch between them. ',B('Not found'),' means nobody in that place fits, which is rare.'),
        li(B('Attributes checked.'),' How many of the 22 attributes could be compared with the retired player. The starting database leaves some blank, and Character and Consistency are never compared because the game re-rolls them. Players develop, so attributes drift apart over the seasons. That does not matter: a regen stays a regen, with the same retired player, however much his attributes change, because it rests on his place in the list, his nationality and his positions.'),
        li(B('Is regen'),' in the Scout filters shows only regens and adds a Regen of column (in orange) to the list. You can also search for the retired player by name on the Regens tab.')),
      h('p',null,B('Limits.')),
      h('ul',null,
        li('It needs the PLAYERS.DB1 that came with the game. If it does not match the save, the tab switches itself off rather than guess.'),
        li('When a regen later retires and is replaced himself, the new regen shows the original player from that slot, not the earlier regen.'),
        li('The retired player\'s CA, PA, club and attributes are their starting values at the start of the game, not what they were when they left.'),
        li('A very small number cannot be matched (Not found), or are a toss-up between two players (Uncertain).'),
        li('Tested on two real saves either side of one season end: all 1,584 regens were found. 1,555 were matched to one player, 21 were uncertain and 8 not found. Every matched answer that could be checked against the earlier save was right (1,249 of 1,249). Not yet tested across many seasons.')),
      ),
    sec('Assistant Manager tab',
      h('p',null,'Choose your club, then set your formation. Sections run in this order:'),
      h('ol',null,
        li(B('Formation and Best 11.'),' Click exactly 10 spots on the pitch to make a shape (the top row is the strikers), or pick a saved formation. Save it with ',B('Save formation'),'; up to 10 are kept. The Best 11 then picks the combination of players that maximises the total Rating across your shape, with the keeper chosen separately.'),
        li(B('Best available 11 / Best 11 (whole squad) tabs.'),' Best available 11 shows your best 11 as of the date of the save, leaving out players who are not available: injured, suspended, cup-tied (when picking for a cup or European match) and, for the best available 11 only, players under 90% condition unless nobody fitter can play that position (see Condition below). Best 11 (whole squad) shows your best possible 11, assuming every player in the squad is available, and ignores condition. Both stay within the Foreign limit where your league has one.'),
        li(B('Picking for.'),' The box at the top of the Best available 11 area sets which match you are picking for: League / domestic (the default), or a European or cup competition your save includes (Champions League, Cup Winners\' Cup, UEFA Cup, FA Cup, League Cup). League and domestic cups use the domestic suspension record, European matches use the European one, and each competition has its own Foreign limit and number of subs. Cup and European matches also leave out cup-tied players.'),
        li(B('Condition.'),' The Cond column in the squad table is the physical condition the game shows on its Physical Condition screen (injured players show a dash). The best available 11 and its bench leave out players under 90% unless nobody fitter can play that position (position penalty 30 or less). Among the rest it prefers players at 95% or more: a player between 90% and 95% loses a number of rating points per % under 95 when the tool picks (1.5 by default, an estimate you can change in Settings). The whole-squad 11 ignores condition.'),
        li(B('Injured, suspended and cup-tied players.'),' The best available 11 and the bench leave out players who are injured (Inj, with the counter from the save), suspended (Sus) or, for cup and European matches, cup-tied (Cup). Suspended is read from the ban record the game keeps for the type of match: the player has matches left to serve and the ban has started by the game date. A ban in one type of match does not stop a player in another. Cup-tied: the save marks a player who has already played in that competition for another club this season, which usually means a recent signing; the game may have a further condition that the tool does not read. International bans are not applied, and players away on international duty are not read yet, so tick "out" for them.'),
        li(B('Foreign players.'),' Some leagues and competitions limit how many Foreign players can be in the match-day squad (the 11 plus the subs). The tool reads the limit from the save (England 4, Spain 4, Scotland, Germany and France 3, European competitions 3 in the standard data; many leagues have none, and a league that is not in your save has no limit applied). The best 11 and best available 11 then stay within it: the 11 is picked first, and the bench uses what is left. The pick is very close to the best legal 11 but is not guaranteed exact. Foreign players carry a blue Foreign label in the tool, as in the game. Foreign means the game\'s own rule: the player\'s country is not on its exempt list (the EU nations plus Norway, Iceland, Switzerland, Finland, Luxembourg, Cyprus, Malta and the Faroe Islands). English and Scottish clubs also exempt Jamaica; Portuguese clubs also exempt Brazil, Angola and Mozambique. In the Scout tool, the Non Foreign filter hides Foreign players for the club set under Your club (Role finder), and there is a Foreign column in the column chooser.'),
        li(B('Suggested bench of 5.'),' Built from available players only: the best available 11 comes first, then the bench is chosen from the available players who are not in it. It has at most one keeper, and the outfield places go to the players who give cover for the most squares in your shape. The Covers column lists the squares each can fill (position penalty 30 or less). It uses what is left of the Foreign limit, and it uses players under 90% condition only where no fitter player can cover a square, or to fill the places.'),
        li(B('Captain and set pieces.'),' Captain, corners, free kicks and penalties, based on the way the engine picks takers.'),
        li(B('Squad.'),' Everyone, with Cond (condition), role fits, Rating, best square and contract. Status tags show XI, Foreign, Inj, Sus, Cup and Int.'),
        li(B('Squad depth.'),' Based on your selected formation, it shows how many players can cover each square, the top three for it, and a count per line. Injured and unavailable players stay in it.'),
        li(B('League reference.'),' Compares your best 11 with every other club in your league, line by line (goalkeeper, defence, midfield and so on), in the shape you choose. The goalkeeper has its own line and is not counted in the whole-team figure. Bands use the spread of the other clubs: below average is the bottom quarter, strong the top quarter, elite the top 10%.'))),
    sec('Shortlist',
      h('p',null,'Click ★ next to a player to add him to your shortlist. Use Compare and Export CSV from this tab too.'),
      h('p',null,B('Where it is saved.'),' Your shortlist is stored in your web browser, for this web address. It is not stored in your game save and it is not uploaded anywhere. That means it is still there next time you open the tool, and it carries over when you load a newer save or when the tool is updated. Players are matched by name and date of birth, so they stay on the list from save to save.'),
      h('p',null,B('When it can be lost.'),' Because it lives in the browser, your shortlist will not follow you to another browser or computer, and it is wiped if you clear your browser data or use a private (incognito) window. The downloaded file and the website also keep separate shortlists.'),
      h('p',null,B('Back it up.'),' Use ',B('Export shortlist'),' on the Shortlist tab to save a small backup file, and ',B('Import shortlist'),' to restore it, for example after switching computers or clearing your browser. Importing adds to your current list, so nothing is overwritten. Export CSV is different: it makes a spreadsheet of the players for you to read, and cannot be imported back.')),
    sec('Settings',
      h('ul',null,
        li(B('Default Engine Ratings.'),' The engine weights are the game\'s own values. If you change anything, the Restore button puts them all back.'),
        li(B('Goalkeeper Rating.'),' The shot stopping, rushing out and aerial shares. Only the proportions matter.'),
        li(B('Position role profiles.'),' What each Role fit rewards: the weight of every attribute for every role. Change these to suit your style. They affect Role fit only, not the engine-based Rating.'),
        li(B('Condition.'),' How many rating points a player between 90% and 95% condition loses when the best available 11 chooses (an estimate, 1.5 by default). Players under 90% are avoided whatever this is set to.'),

        li(B('Colours and cut-offs.'),' Rating and fit thresholds.'),
        li(B('This save.'),' Which save is loaded, and any notes such as missing files.'))),
    sec('Known limits',
      h('ul',null,
        li(...DISCLAIMER()),
        li('Regens: needs PLAYERS.DB1 from the same game as your save. The player he replaced is only named if he was in that starting database, so regens of earlier regens and players added later show as Not found or point to the original player in that slot. A season-end also removes players who did not retire (for example some young players), so "replaced" is more accurate than "retired". Tested on one season end.'),
        li('The goalkeeper blend (70% shot stopping, 15% rushing out, 15% aerial by default) is an estimate. How often each situation reaches a keeper has not been measured.'),
        li('Promotion and relegation: a club\'s division is read from its record in the save. The game appears to update this behind the scenes after the end-of-season shortlisting in June, but in the game the club will still show in its previous league until the game updates on 16 July. Only the leagues loaded in the save follow promotion and relegation; others use the starting database.'),
        li('The current build does not account for positional arrows in the formation selector, but an arrow suitability is provided for each player, based on their Off the ball and Positioning attributes. It assumes the player is at 100% condition: a lower condition reduces their effectiveness with an arrow, and the percentage shown is not adjusted for the Cond column.'),
        li('Condition rules in the best available 11 are my own: leaving out players under 90% and preferring those at 95% or more are choices made for the tool, and the size of the preference (1.5 points per %) is an estimate. The game does not choose a team this way.'),
        li('Foreign limits are read from the save, so a league that is not in it has none applied, and the Italian league limit could not be verified. Cup-tied is read from the save\'s flag for the competition and may miss a further condition the game applies. Suspensions in international matches and players away on international duty are not read yet.'),
        li('The Assistant Manager tools (best 11, squad depth, league reference) do not work for national teams in the current build. I hope to add this in an update.'),
        li('Matches are not simulated here. The tool tells you who rates best, it does not predict results.'),
        li('Values shown are the game\'s own estimate worked out for your club as buyer, not an asking price.'))),
    sec('Troubleshooting',
      tbl(['Problem','Try this'],[
        ['My save will not load, or looks incomplete','Check the folder you chose has all the files listed below. It does by default, so a missing file is unlikely.'],
        ['"No save found"','Choose the folder that holds PLDATA#.S16 and TMDATA#.S16, not a parent folder.'],
        ['Nationalities or leagues missing','PLAYERS.DB1 or TMDATA.DB1 was not in the folder you chose. Choose the whole folder.'],
        ['Everyone looks available','MGDATA and CPDATA were missing. The note in Settings under This save says so.'],
        ['Ages look wrong','Set the game date top right as dd.mm.yy.'],
        ['League reference says no league found','The club name in the save has to match TMDATA.DB1, or the club is in a league the game does not simulate.'],
        ['Settings seem odd','Settings > Default Engine Ratings > Restore, then Reset all to defaults.']]),
      h('details',{class:'fold'},h('summary',null,'Which files must be in the folder?'),
        h('p',{class:'small'},'The game sets this up by default. The number in a file name is the save slot: slot 1 files end in 1, slot 2 files end in 2, and so on, so you will only see sets for the slots you have used. The example below shows slot 1, plus one slot 2 set. PLAYERS.DB1, TMDATA.DB1 and GAMESS16.IDX are shared by all saves.'),
        h('pre',{class:'dirlist'},'PLDATA1.S16   TMDATA1.S16   GNDATA1.S16   MGDATA1.S16   CPDATA1.S16     (save slot 1)\nPLDATA2.S16   TMDATA2.S16   GNDATA2.S16   MGDATA2.S16   CPDATA2.S16     (save slot 2)\nGAMESS16.IDX\nPLAYERS.DB1\nTMDATA.DB1'))),
    sec('About',
      h('p',null,B('Version 1.1'),' (November 2026). A fan-made tool. Not affiliated with or endorsed by the game\'s publisher or developer.'),
      h('details',{class:'fold'},h('summary',null,'Version history'),h('ul',null,li(B('v1.1'),' (November 2026): new Regens tab and "Is regen" filter in Scout, showing who each regen replaced. Goalkeeper added to the league reference and Best 11 comparison. Tick boxes in Find players aligned.'),li(B('v1.0'),' (November 2026): first public release. Scout with role finder and engine-based Rating, Assistant Manager with best 11, squad depth and league reference, shortlist and settings.'))),
      h('p',null,'Created by ',X('RobertoLarcos_6','@RobertoLarcos_6'),'. Contact and updates on X. If the tool helps you, you can ',coffeeBtn('coffeelink','buy me a coffee'),'.'),
      h('p',null,...DISCLAIMER()),
      h('p',null,'The engine scoring is a port of the game\'s own routines, checked against the original program. The way the match engine uses attributes was also informed by John North\'s "Exploring the Match Engine" article. Everything runs in your browser.')),
    sec('Thanks and acknowledgements',

      h('div',{class:'thanks'},[
        ['CM9798 - Remastered','cm9798v2',null,'As well as other members of the community, they are doing unthinkable things with this beloved game, making updated versions and improvements all these years later. Check out their account to see how to download and play CM9798 v2, which this tool is based on, and for news of the upcoming Remaster project.'],
        ['Dave Black','cm9798','https://cm9798.co.uk/','Runs cm9798.co.uk, an amazing resource for all things 9798, with tactics, discussions, tools and more.'],

function showLoader(){

  const info=h('div',{id:'loadinfo',class:'small',style:'margin-top:12px'});
  const dirIn=h('input',{type:'file',webkitdirectory:true,multiple:true,style:'display:none',onchange:e=>gotFiles(e.target.files)});
  const fileIn=h('input',{type:'file',multiple:true,style:'display:none',onchange:e=>gotFiles(e.target.files)});
  const lastBox=h('div',{class:'ld-last'});
  const btns=h('div',{class:'ld-btns'},h('button',{class:'b p big',onclick:()=>pickFolder(()=>dirIn.click())},'Choose game folder…'),dirIn,fileIn);
  const files=h('details',{class:'ld-files'},h('summary',null,'Which files does it need?'),
    h('p',{class:'small'},'All of these are in your Data folder by default. The number in a file name is the save slot (slot 1 shown; slot 2 files end in 2).'),
    h('pre',{class:'dirlist'},'PLDATA1.S16  TMDATA1.S16  GNDATA1.S16  MGDATA1.S16  CPDATA1.S16\nGAMESS16.IDX  PLAYERS.DB1  TMDATA.DB1'),
    h('p',{class:'small'},'Cannot choose a folder (for example on a phone or tablet)? ',h('span',{class:'link',onclick:()=>fileIn.click()},'Pick the files instead'),'. Select all of the files above for one save slot only.'));
  const path=h('div',{class:'ld-path'},h('span',{class:'small mute'},'Typical location'),h('code',null,'C:\\Users\\<your name>\\Documents\\Games\\CM9798\\cm9798_fan_mode\\cm9798\\Data\\cm9798'));
  const steps=[['1','Save in the game','The tool reads your saved game, so save first.'],['2','Choose your Data folder','Pick the folder that holds your save files.'],['3','Pick a slot and load','Then choose your club in the Assistant Manager.']];
  const trust=h('div',{class:'small mute ld-trust'},'🔒 Read-only. Files are read once into your browser, nothing is changed or uploaded. After saving again in the game, use Load another save to refresh.');
  const coffee=h('div',{class:'ld-coffee'},'Enjoying the tool? ',coffeeBtn('coffeelink','Buy me a coffee ☕'));
  const drop=h('div',{class:'ld ld-a'},h('h2',null,'CM97/98 Scout & Assistant'),h('p',{class:'ld-sub'},'Scout players and pick your best 11 using the match engine\'s own scoring.'),
    h('div',{class:'ld-compat'},...DISCLAIMER()),
    h('div',{class:'ld-steps'},steps.map(([n,t,d])=>h('div',{class:'ld-step'},h('i',null,n),h('b',null,t),h('span',null,d)))),
    lastBox,btns,info,path,files,trust,coffee);
  if(canPick())idb.get('last').then(rec=>{if(rec&&rec.handle){lastBox.replaceChildren(h('button',{class:'b p big',title:'Reads the folder you used last time again. Your browser may ask you to allow it.',onclick:e=>{e.currentTarget.disabled=true;loadLast(rec);}},'Load last save'+(rec.label?' · '+rec.label.replace(/:\s*$/,''):'')),h('div',{class:'small mute',style:'margin-top:4px'},'Uses the folder you chose last time. Your browser may ask you to allow access again.'));}}).catch(()=>{});
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hot');});drop.addEventListener('dragleave',()=>drop.classList.remove('hot'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hot');gotFiles(e.dataTransfer.files);});
  root.append(drop);
}
/* ---- remembered folder (Chrome and Edge): lets Reload and Load last save work without choosing the folder again ---- */
const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('cm98',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
};
const canPick=()=>typeof window.showDirectoryPicker==='function';
async function readDirHandle(dir){const files={};for await(const [name,hd] of dir.entries()){if(hd.kind!=='file')continue;const u=name.toUpperCase();if(/\.(S16|IDX|DB1)$/.test(u))files[u]=await hd.getFile();}return files;}
async function ensureRead(dir){let p=await dir.queryPermission({mode:'read'});if(p!=='granted')p=await dir.requestPermission({mode:'read'});return p==='granted';}
async function prepFiles(files){
  const slots=[];for(let n=1;n<=7;n++)if(files['PLDATA'+n+'.S16']&&files['TMDATA'+n+'.S16'])slots.push(n);
  let names=[];if(files['GAMESS16.IDX']){names=parseIdx(new Uint8Array(await files['GAMESS16.IDX'].arrayBuffer()));}
  slots.sort((a,b)=>files['PLDATA'+b+'.S16'].lastModified-files['PLDATA'+a+'.S16'].lastModified);
  return {slots,names};
}
async function pickFolder(fallback){
  if(!canPick()){fallback();return;}
  try{const dir=await window.showDirectoryPicker({mode:'read',id:'cm98data'});const files=await readDirHandle(dir);await gotFiles(files,dir);}
  catch(e){if(e&&e.name==='AbortError')return;fallback();}
}
async function loadLast(rec,btn){
  const info=$('#loadinfo');
  try{
    if(!(await ensureRead(rec.handle)))throw new Error('permission to read the folder was not given');
    const files=await readDirHandle(rec.handle);const {slots,names}=await prepFiles(files);
    if(!slots.includes(rec.slot))throw new Error('slot '+rec.slot+' is no longer in that folder');
    S.dir={handle:rec.handle};S.load={files,slots,names};await loadSlot(rec.slot);
  }catch(e){if(info)info.replaceChildren(h('span',{style:'color:var(--bad)'},'Could not open the last save ('+e.message+'). Choose your game folder instead.'));}
}
async function reloadSave(btn){
  if(!S.dir||!S.world)return;
  const label=btn.textContent;btn.disabled=true;btn.textContent='Reloading…';
  try{
    if(!(await ensureRead(S.dir.handle)))throw new Error('permission to read the folder was not given');
    const files=await readDirHandle(S.dir.handle);const {slots,names}=await prepFiles(files);
    const n=S.slotN;if(!slots.includes(n))throw new Error('slot '+n+' is no longer in that folder');
    const keep=[...S.squad.excl].map(i=>S.world.players[i]).filter(Boolean).map(plKey);
    S.load={files,slots,names};await loadSlot(n,{reload:true,keep});
  }catch(e){alert('Could not reload the save: '+e.message);btn.disabled=false;btn.textContent=label;}
}
async function gotFiles(list,dirHandle){
  const files={};if(list instanceof FileList||Array.isArray(list)){for(const f of list){files[f.name.toUpperCase()]=f;}}else Object.assign(files,list);
  S.dir=dirHandle?{handle:dirHandle}:null;
  const slots=[];
  for(let n=1;n<=7;n++)if(files['PLDATA'+n+'.S16']&&files['TMDATA'+n+'.S16'])slots.push(n);
  const info=$('#loadinfo');
  if(!slots.length){info.replaceChildren(h('span',{style:'color:var(--bad)'},'No save found. I could not see matching PLDATA#.S16 and TMDATA#.S16 files in what you chose. Pick the Data folder that contains your saves.'));return;}
  let names=[];if(files['GAMESS16.IDX']){names=parseIdx(new Uint8Array(await files['GAMESS16.IDX'].arrayBuffer()));}
  slots.sort((a,b)=>files['PLDATA'+b+'.S16'].lastModified-files['PLDATA'+a+'.S16'].lastModified);
  S.load={files,slots,names};
  const sel=h('select',{id:'slotSel'},slots.map(n=>{const nm=(names[n-1]||{}).name||('Game #'+n);const d=new Date(files['PLDATA'+n+'.S16'].lastModified);return h('option',{value:n},'Slot '+n+': '+nm+'  (saved '+d.toLocaleString('en-GB')+')');}));
  const miss=[];if(!files['PLAYERS.DB1'])miss.push('PLAYERS.DB1 (needed for nationality names)');if(!files['TMDATA.DB1'])miss.push('TMDATA.DB1 (needed for leagues)');
  info.replaceChildren(h('div',{style:'margin:8px 0'},h('label',{class:'f',style:'display:inline-flex'},'Save to load',sel)),' ',h('button',{class:'b p',onclick:()=>loadSlot(Number(sel.value))},'Load this save'),
    ...(miss.length?[h('div',{class:'warnbox'},'Not found in the folder you chose: '+miss.join('; ')+'. The tool still works without them.')]:[]));
}
async function loadSlot(n,opt){
  opt=opt||{};
  const info=$('#loadinfo')||{replaceChildren(){}};info.replaceChildren('Reading files…');
  const f=S.load.files;const rd=async x=>x?new Uint8Array(await x.arrayBuffer()):null;
  try{
    const pl=await rd(f['PLDATA'+n+'.S16']),tm=await rd(f['TMDATA'+n+'.S16']),gn=await rd(f['GNDATA'+n+'.S16']),mg=await rd(f['MGDATA'+n+'.S16']),cp=await rd(f['CPDATA'+n+'.S16']);
    const db1p=await rd(f['PLAYERS.DB1']),db1t=await rd(f['TMDATA.DB1']);
    let date=[20,12,1997];if(gn&&gn.length>0x1ad){const d=gn[3],m=gn[4],y=1900+gn[5];if(d>=1&&d<=31&&m>=1&&m<=12&&y>=1990&&y<=2100)date=[d,m,y];}
    const W=buildWorld({pl,tm,gn,mg,cp,db1players:db1p,db1teams:db1t},n,date);
    W.byClub={};for(const p of W.players){(W.byClub[p.clubId]=W.byClub[p.clubId]||[]).push(p);p._n=p.name.toLowerCase();}
    for(const p of W.players)p._c=p.club.toLowerCase();
    W.slotLabel='Slot '+n+': '+((S.load.names[n-1]||{}).name||'');
    W.gameDate=date;S.world=W;S.slotN=n;S.page=0;S.cmp=new Set();
    if(opt.reload){const k=new Set(opt.keep||[]);S.squad.excl=new Set(W.players.filter(p=>k.has(plKey(p))).map(p=>p.idx));}else{S.squad.club=null;S.squad.excl=new Set();restoreClub();}
    if(S.dir&&S.dir.handle)idb.set('last',{handle:S.dir.handle,slot:n,label:W.slotLabel}).catch(()=>{});
    const clubs=document.getElementById('clubs');
    render();
  }catch(e){info.replaceChildren(h('span',{style:'color:var(--bad)'},'Could not read the save: '+e.message));console.error(e);}
}

/* ---------- shell ---------- */
function render(){
  const W=S.world;const hd=$('#hdr');hd.replaceChildren(h('div',{class:'hdt'},h('h1',null,'CM97/98 Scout ',h('span',null,'& Assistant')),h('div',{class:'compat'},'Built for the fan-made CM9798 v2 · not tested on other versions')));
  const root=$('#view');root.replaceChildren();
  if(!W){hd.append(h('span',{class:'status'},'No save loaded'),h('div',{class:'hd-right'},coffeeBtn('coffee hc')));$('#tabs').replaceChildren();showLoader();return;}
  const dateIn=h('input',{type:'text',value:fmtDate(W.gameDate[0],W.gameDate[1],W.gameDate[2]),style:'width:78px',title:'Game date used for ages (dd.mm.yy)',onchange:e=>{const m=/^(\d+)\.(\d+)\.(\d+)$/.exec(e.target.value.trim());if(!m)return;const y=+m[3]<100?1900+ +m[3]:+m[3];W.gameDate=[+m[1],+m[2],y];computeAges(W,W.gameDate);render();}});
  hd.append(h('span',{class:'status'},W.slotLabel+' · '+W.players.length.toLocaleString()+' players · game date ',dateIn,' (set it if ages look off)'),
    h('div',{class:'hd-right'},coffeeBtn('coffee hc'),(S.dir?h('button',{class:'b ldbtn',title:'Read this save again from your game folder, keeping your club, filters and shortlist',onclick:e=>reloadSave(e.currentTarget)},'Reload'):null),h('button',{class:'b ldbtn',onclick:()=>{S.world=null;render();}},'Load another save')));
  const tabs=[['scout','Scout'],['squad','Assistant Manager'],['regens','Regens'],['short','Shortlist ('+S.short.size+')'],['settings','Settings'],['about','Instructions & About']];
  $('#tabs').replaceChildren(...tabs.map(([k,l])=>h('button',{class:S.tab===k?'on':'',onclick:()=>{const prev=S.tab;S.tab=k;S.page=0;if(k==='regens')S.sort={id:'ca',dir:-1};else if(prev==='regens')S.sort={id:'rating',dir:-1};render();}},l)));
  root.append(h('datalist',{id:'clubs'},W.teams.filter(t=>W.byClub[t.id]).map(t=>h('option',{value:t.name}))));
  if(S.tab==='scout')renderScout(root);else if(S.tab==='squad')renderSquad(root);else if(S.tab==='regens')renderRegens(root);else if(S.tab==='short')renderShort(root);else if(S.tab==='about')renderAbout(root);else renderSettings(root);
}
document.addEventListener('DOMContentLoaded',render);
